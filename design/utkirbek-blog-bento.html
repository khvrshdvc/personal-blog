<style>
:root{color-scheme:light;--glass-a:.62;--bg:#f2f2f7;--elev:#ffffff;--plain:#ffffff;--cellp:#f2f2f7;--code:#f2f2f7;--fill:rgba(120,120,128,.2);--fill-2:rgba(120,120,128,.16);--fill-3:rgba(118,118,128,.12);--fill-4:rgba(116,116,128,.08);--label:#000000;--label-2:#6c6c70;--label-3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);--tint:#007aff;--blue:#0066cc;--btn:#0066cc;--green:#34c759;--green-t:#1e7e34;--red:#ff3b30;--red-t:#d70015;--red-btn:#d92d20;--orange:#ff9500;--orange-t:#c93400;--indigo:#5856d6;--purple:#af52de;--pink:#ff2d55;--teal:#30b0c7;--gray:#8e8e93;--knob:#ffffff;--pill:rgba(0,0,0,.075);--hover:rgba(0,0,0,.035);--sel:rgba(0,122,255,.13);--hm0:#ebebf0;--edge:rgba(242,242,247,.75);--glass-rgb:255,255,255;--glass-e1:rgba(255,255,255,.95);--glass-e2:rgba(255,255,255,.15);--g-shadow:0 10px 30px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.08);--card-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04);--sheet:#f2f2f7;--sheet-cell:#ffffff;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;--serif:ui-serif,"New York","Source Serif 4","Iowan Old Style",Georgia,serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"JetBrains Mono",Consolas,monospace;--r-list:24px;--r-card:26px}
[data-theme="dark"]{color-scheme:dark;--bg:#000000;--elev:#1c1c1e;--plain:#000000;--cellp:#1c1c1e;--code:#1c1c1e;--fill:rgba(120,120,128,.36);--fill-2:rgba(120,120,128,.32);--fill-3:rgba(118,118,128,.24);--fill-4:rgba(118,118,128,.16);--label:#ffffff;--label-2:#98989f;--label-3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--tint:#0a84ff;--blue:#0a84ff;--btn:#0b6bd6;--green:#30d158;--green-t:#30d158;--red:#ff453a;--red-t:#ff6961;--red-btn:#d8342b;--orange:#ff9f0a;--orange-t:#ff9f0a;--indigo:#5e5ce6;--purple:#bf5af2;--pink:#ff375f;--teal:#40c8e0;--gray:#98989f;--knob:#636366;--pill:rgba(255,255,255,.13);--hover:rgba(255,255,255,.04);--sel:rgba(10,132,255,.24);--hm0:#2c2c2e;--edge:rgba(0,0,0,.7);--glass-rgb:40,40,44;--glass-e1:rgba(255,255,255,.3);--glass-e2:rgba(255,255,255,.03);--g-shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);--card-shadow:none;--sheet:#1c1c1e;--sheet-cell:#2c2c2e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
::selection{background:color-mix(in srgb,var(--tint) 30%,transparent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 60%,transparent);outline-offset:2px;border-radius:12px}
.mono{font-family:var(--mono);letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.t-sun{display:none}
[data-theme="dark"] .t-sun{display:block}
[data-theme="dark"] .t-moon{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sk{to{background-position:-200% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(36px) scale(.98)}}
@keyframes sheetOut{to{opacity:0;transform:translateY(36px) scale(.98)}}
@keyframes alertIn{from{opacity:0;transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.view-in{animation:vin .4s cubic-bezier(.2,.8,.2,1)}
.skel{display:block;border-radius:16px;background:linear-gradient(90deg,var(--fill-4),var(--fill-3),var(--fill-4));background-size:200% 100%;animation:sk 1.3s infinite}

.glass{position:relative;background:rgba(var(--glass-rgb),var(--glass-a));-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--g-shadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,var(--glass-e1),var(--glass-e2) 42%,var(--glass-e2) 62%,var(--glass-e1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(var(--glass-rgb),.97)}}

.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:44px;padding:0;border:0;border-radius:999px;color:var(--label);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.gbtn:active{transform:scale(.92)}
.gbtn svg{width:20px;height:20px}
.gbtn.cap{padding:0 16px 0 10px;font-size:17px;font-weight:500}
.gbtn.cap svg{width:18px;height:18px;stroke-width:2.4}
.gbtn.tint{background:var(--btn);color:#ffffff;box-shadow:none}
.gbtn.tint svg{stroke-width:2.4}
.av{width:32px;height:32px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg,#6aa8ff,#3d5be0);color:#ffffff;font-family:var(--rounded);font-size:15px;font-weight:700;letter-spacing:0}
.av.md{width:44px;height:44px;font-size:19px}
.av.lg{width:60px;height:60px;font-size:26px}
.capbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border:0;border-radius:999px;font-size:17px;font-weight:600;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s,background-color .2s}
.capbtn:active{transform:scale(.96)}
.capbtn svg{width:18px;height:18px}
.capbtn.filled{background:var(--btn);color:#ffffff}
.capbtn.tinted{background:color-mix(in srgb,var(--tint) 15%,transparent);color:var(--blue)}
.capbtn.gray{background:var(--fill-3);color:var(--label)}
.capbtn.plain{background:none;color:var(--blue);padding:0 10px}
.capbtn.sm{height:34px;padding:0 14px;font-size:15px}
.capbtn.lg{width:100%;height:52px}
.capbtn:disabled{opacity:.35;pointer-events:none}
.tbtn{min-height:44px;padding:0 6px;border:0;background:none;color:var(--blue);font-size:17px}
.tbtn.done{font-weight:600}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--fill-3);color:var(--label-2);font-family:var(--mono);font-size:12px;letter-spacing:0}

body{--bg:#f4f4f5;--card:#ffffff;--card2:#fbfbfc;--line:rgba(0,0,0,.07);--hi:rgba(255,255,255,.9);--t1:#111113;--t2:#6e6e73;--t3:#a1a1a6;--chip:rgba(0,0,0,.045);--glowc:rgba(0,0,0,.22);--glowf:rgba(0,0,0,.025);--grid:rgba(0,0,0,.045);--inv:#111113;--inv-t:#ffffff;--top:rgba(255,255,255,.9);--bar:rgba(255,255,255,.7);--bar-l:rgba(0,0,0,.08);--bar-sh:0 12px 34px rgba(0,0,0,.12);--dkb:rgba(255,255,255,.9);--dkl:rgba(0,0,0,.07);--hmg:rgba(0,0,0,.06)}
[data-theme="dark"] body{--bg:#09090b;--card:#141416;--card2:#0f0f11;--line:rgba(255,255,255,.07);--hi:rgba(255,255,255,.05);--t1:#f5f5f7;--t2:#a1a1a6;--t3:#6e6e73;--chip:rgba(255,255,255,.06);--glowc:rgba(255,255,255,.5);--glowf:rgba(255,255,255,.055);--grid:rgba(255,255,255,.035);--inv:#f5f5f7;--inv-t:#0b0b0c;--top:rgba(255,255,255,.08);--bar:rgba(36,36,40,.6);--bar-l:rgba(255,255,255,.12);--bar-sh:0 20px 50px rgba(0,0,0,.6);--dkb:rgba(255,255,255,.08);--dkl:rgba(255,255,255,.1);--hmg:rgba(255,255,255,.06)}
body:not([data-route="admin"]){background:var(--bg)}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 50% -12%,var(--top),transparent 70%)}
#bgfx::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;-webkit-mask:radial-gradient(ellipse 70% 55% at 50% 12%,#000,transparent 75%);mask:radial-gradient(ellipse 70% 55% at 50% 12%,#000,transparent 75%)}
body[data-route="admin"] #bgfx{display:none}

#site{--label:var(--t1);--label-2:var(--t2);--label-3:var(--t3);--elev:var(--card);--cellp:var(--chip);--code:var(--chip);--sep:var(--line);--hover:var(--chip);--fill-3:var(--chip);--card-shadow:inset 0 0 0 1px var(--line);--hm0:var(--hmg);--tint:var(--t1);--blue:var(--t1);--btn:var(--inv);color:var(--t1)}
#site .list{box-shadow:inset 0 0 0 1px var(--line)}
#site .capbtn.filled{color:var(--inv-t)}
#site .sdot{display:none}
#site .segc{background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
#site .ricon{background:var(--chip);color:var(--t1)}
#site .tok{background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--mono);font-size:12.5px;font-weight:400;letter-spacing:0}
#site .tok.hl{background:var(--inv);color:var(--inv-t);box-shadow:none}
#site .rstat.success,#site .rstat.skipped,#site .rstat.running{color:var(--t2)}
#site .ci.success,#site .ci.running,#site .ci.skipped{color:var(--t2)}
#site .lang::before{background:var(--t3)}
#site .hm i[data-l="1"],.mhm i[data-l="1"]{background:color-mix(in srgb,var(--t1) 18%,var(--hmg))}
#site .hm i[data-l="2"],.mhm i[data-l="2"]{background:color-mix(in srgb,var(--t1) 40%,var(--hmg))}
#site .hm i[data-l="3"],.mhm i[data-l="3"]{background:color-mix(in srgb,var(--t1) 66%,var(--hmg))}
#site .hm i[data-l="4"],.mhm i[data-l="4"]{background:var(--t1)}
#site .sum{gap:12px;overflow:visible;background:none;box-shadow:none}
#site .sum>div{border:0;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
#site .sum b{font-family:var(--font);font-weight:600;letter-spacing:-.03em}
#site .card{border-radius:24px;box-shadow:inset 0 0 0 1px var(--line)}
#site .group-h{margin:0 0 10px 4px;font-size:12.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--t3)}
#site .prose a{text-decoration:underline;text-decoration-color:var(--t3);text-underline-offset:3px}
#site .prose blockquote{background:var(--chip);border-radius:18px}
#site .copy-code{background:var(--chip);color:var(--t1)}
#site .disc{border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
#site .disc a{color:var(--t1)}
#site .code-wrap{border-radius:18px;box-shadow:inset 0 0 0 1px var(--line)}
#site .av{background:var(--inv);color:var(--inv-t);font-family:var(--font);font-weight:600}
#site .r-top .tlink{display:inline-flex;align-items:center;gap:6px;height:36px;margin:0;padding:0 14px 0 10px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500;color:var(--t1)}
#site .status{height:30px;margin:0;padding:0 12px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--t1);font-weight:500}
#site .status i{box-shadow:0 0 10px var(--green)}

.wrapx{max-width:1180px;margin:0 auto;padding:0 32px}

.c{position:relative;isolation:isolate;display:block;min-width:0;overflow:hidden;padding:20px 22px;border-radius:24px;background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 var(--hi);color:var(--t1);--x:-600px;--y:-600px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.c::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(420px circle at var(--x) var(--y),var(--glowf),transparent 60%);pointer-events:none}
.c::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;padding:1px;background:radial-gradient(260px circle at var(--x) var(--y),var(--glowc),transparent 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
a.c:hover{transform:translateY(-2px)}
a.c:active{transform:scale(.99)}
.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;letter-spacing:.01em;color:var(--t3)}
.ck svg{width:14px;height:14px;stroke-width:2}
.ck .r{margin-left:auto}
.arr{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--inv);color:var(--inv-t);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.arr svg{width:18px;height:18px;stroke-width:2.2}
a.c:hover .arr{transform:rotate(45deg)}
.arr.sm{width:32px;height:32px;background:var(--chip);color:var(--t1)}
.arr.sm svg{width:15px;height:15px}

.hero{margin:48px 0 28px}
.hero h1{margin:0;max-width:1000px;font-size:clamp(40px,4.6vw,58px);line-height:1.03;font-weight:600;letter-spacing:-.045em}
.hero h1 span{color:var(--t3)}
.hero p{margin:16px 0 0;max-width:560px;font-size:16px;line-height:1.55;color:var(--t2)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:110px;gap:12px}
.b-post{grid-column:span 6;grid-row:span 3;display:flex;flex-direction:column}
.b-post .qm{position:absolute;right:20px;top:-60px;z-index:-1;font-family:var(--serif);font-size:300px;line-height:1;color:var(--chip)}
.b-post h2{margin:auto 0 0;font-family:var(--serif);font-size:clamp(28px,2.8vw,38px);line-height:1.12;font-weight:600;letter-spacing:-.01em}
.b-post p{margin:14px 0 0;max-width:500px;font-size:15.5px;line-height:1.55;color:var(--t2)}
.cf{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;font-size:13px;color:var(--t3)}
.b-loc{grid-column:span 3;grid-row:span 2}
.radar{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(circle,var(--t3) 1px,transparent 1.4px);background-size:14px 14px;opacity:.5;-webkit-mask:radial-gradient(circle at 50% 46%,#000 0,transparent 62%);mask:radial-gradient(circle at 50% 46%,#000 0,transparent 62%)}
.pin{position:absolute;left:50%;top:46%;z-index:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--t1);box-shadow:0 0 18px 4px color-mix(in srgb,var(--t1) 40%,transparent)}
.pin i{position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--t1);opacity:0;animation:ping 3s cubic-bezier(.2,.6,.3,1) infinite}
.pin i:nth-child(2){animation-delay:1s}.pin i:nth-child(3){animation-delay:2s}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(9);opacity:0}}
.lb{position:absolute;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end}
.lb b{display:block;font-size:15px;font-weight:600}
.lb small{display:block;margin-top:2px;font-family:var(--mono);font-size:10.5px;color:var(--t3)}
.lb .tm{font-size:28px;font-weight:300;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.b-gh{grid-column:span 3;grid-row:span 2}
.gn{margin-top:10px;font-size:40px;font-weight:600;letter-spacing:-.045em;line-height:1}
.gn small{margin-left:4px;font-size:13px;font-weight:400;letter-spacing:0;color:var(--t3)}
.mhm{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px;margin-top:16px}
.mhm i{display:block;aspect-ratio:1;border-radius:2px;background:var(--hmg)}
.mhm i.x{visibility:hidden}
.b-lrn{grid-column:span 3;grid-row:span 1;padding:0}
.lp{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:0 22px;opacity:0;transform:translateY(14px);transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
.lp.on{opacity:1;transform:none}
.lp.was{transform:translateY(-14px)}
.ring{position:relative;flex-shrink:0;width:62px;height:62px}
.ring svg{display:block;width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .tr{stroke:var(--chip)}
.ring .pr{stroke:var(--t1);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.lt1{display:block;font-size:12px;color:var(--t3)}
.lt2{display:block;margin-top:3px;font-size:16px;font-weight:600;letter-spacing:-.02em}
.ldots{position:absolute;right:12px;top:50%;display:flex;flex-direction:column;gap:4px;transform:translateY(-50%)}
.ldots i{width:4px;height:4px;border-radius:2px;background:var(--t3);opacity:.4;transition:height .3s,opacity .3s}
.ldots i.on{height:12px;opacity:1}
.b-tch{grid-column:span 3;grid-row:span 1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tv{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1}
.tt{margin-top:6px;font-size:12.5px;color:var(--t3)}
.tdots{display:grid;grid-template-columns:repeat(6,8px);gap:5px}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--t1);opacity:.8}
.tdots i:nth-child(n+10){opacity:.18}
.b-term{grid-column:span 6;grid-row:span 2;padding:0}
.tbar2{display:flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-bottom:1px solid var(--line)}
.tbar2 i{width:10px;height:10px;border-radius:50%;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
.tbar2 span{margin:0 auto;font-family:var(--mono);font-size:11.5px;color:var(--t3)}
.tc{padding:14px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.85;color:var(--t2);white-space:nowrap;overflow:hidden}
.tc>div{overflow:hidden;text-overflow:ellipsis;opacity:0;animation:tl .35s ease forwards}
.tc b{font-weight:400;color:var(--t1)}
.tc em{font-style:normal;color:var(--t3)}
.tc .ok{color:var(--t1)}
.tc .bad{color:var(--red)}
@keyframes tl{to{opacity:1}}
.cur{display:inline-block;width:7px;height:14px;margin-left:2px;vertical-align:-2px;background:var(--t1);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.b-proj{grid-column:span 3;grid-row:span 2;display:flex;flex-direction:column}
.pl{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.pi{display:flex;align-items:center;gap:10px;min-width:0}
.pm{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:11.5px;font-weight:600}
.pn{flex:1;min-width:0;overflow:hidden;font-size:14.5px;font-weight:500;text-overflow:ellipsis;white-space:nowrap}
.pd{width:7px;height:7px;flex-shrink:0;border-radius:50%;background:var(--t3)}
.pd.success{background:var(--t1)}.pd.failure{background:var(--red)}.pd.running{background:transparent;box-shadow:inset 0 0 0 1.5px var(--t1)}
.b-stk{grid-column:span 3;grid-row:span 2;display:flex;flex-direction:column}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tags span{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--mono);font-size:11.5px;color:var(--t2)}
.tags span.on{background:var(--inv);color:var(--inv-t);box-shadow:none}
.b-rec{grid-column:span 5;grid-row:span 2;display:flex;flex-direction:column}
.ck a{color:var(--t2);transition:color .2s}
.ck a:hover{color:var(--t1)}
.rl{display:flex;flex-direction:column;margin-top:auto}
.rl a{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.rl a:first-child{border-top:0}
.rl time{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.rl span{overflow:hidden;font-family:var(--serif);font-size:16.5px;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.rl a:hover span{color:var(--t2)}
.b-tg{grid-column:span 7;grid-row:span 2;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px;padding:18px}
.tg-l{display:flex;flex-direction:column;min-width:0;padding:2px 0 0 4px}
.tg-ch{margin-top:auto}
.tg-av{position:relative;width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--inv);color:var(--inv-t);box-shadow:0 0 0 5px var(--chip)}
.tg-av svg{width:24px;height:24px;margin:2px 2px 0 0;stroke-width:1.8}
.tg-av i{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--card)}
.tg-n{display:block;margin-top:14px;overflow:hidden;font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.15;text-overflow:ellipsis;white-space:nowrap}
.tg-u{display:block;margin-top:4px;overflow:hidden;font-family:var(--mono);font-size:12px;color:var(--t3);text-overflow:ellipsis;white-space:nowrap}
.tg-btn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:38px;margin-top:16px;padding:0 16px 0 14px;border-radius:999px;background:var(--inv);color:var(--inv-t);font-size:14px;font-weight:600;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tg-btn svg{width:15px;height:15px;stroke-width:2.2}
.tg-btn:hover{transform:translateY(-1px)}
.tg-btn:active{transform:scale(.97)}
.tg-chat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0;overflow:hidden;padding:10px 12px 12px;border-radius:18px;background-color:var(--chip);background-image:radial-gradient(circle,var(--line) 1px,transparent 1.3px);background-size:12px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.tg-chat::before{content:"";position:absolute;inset:0 0 auto;height:44px;background:linear-gradient(var(--card2),transparent);opacity:.9;pointer-events:none}
.tg-day{position:relative;align-self:center;margin-bottom:auto;padding:4px 10px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;font-weight:500;color:var(--t3)}
.tg-b{position:relative;max-width:94%;padding:8px 11px 6px;border-radius:16px 16px 16px 5px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 6px 16px -10px rgba(0,0,0,.4);animation:tgIn .5s cubic-bezier(.2,.8,.2,1) both}
.tg-b:nth-of-type(2){animation-delay:.12s}
.tg-b:nth-of-type(3){animation-delay:.24s}
.tg-b p{display:-webkit-box;margin:0;overflow:hidden;font-size:13px;line-height:1.4;letter-spacing:-.005em;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.tg-b small{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px;font-size:10.5px;color:var(--t3)}
.tg-b small svg{width:11px;height:11px}
@keyframes tgIn{from{opacity:0;transform:translateY(10px) scale(.98)}}

.ph{margin:48px 0 28px}
.eyebrow{margin:0;font-size:14px;font-weight:500;color:var(--t3)}
.ph h1{margin:10px 0 0;max-width:820px;font-size:clamp(34px,4vw,50px);line-height:1.05;font-weight:600;letter-spacing:-.045em}
.ph h1 span{color:var(--t3)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ftabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
#site .ftabs .scope{height:34px;padding:0 14px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500;color:var(--t2)}
#site .ftabs .scope:hover{color:var(--t1)}
#site .ftabs .scope[aria-pressed="true"]{background:var(--inv);color:var(--inv-t);box-shadow:none}
.fs{display:flex;align-items:center;gap:8px;width:260px;height:38px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--t3)}
.fs svg{width:16px;height:16px;flex-shrink:0}
.fs input{flex:1;min-width:0;height:100%;padding:0;border:0;background:none;outline:none;font-size:14px;color:var(--t1)}
.fs input::placeholder{color:var(--t3)}
.fs input::-webkit-search-cancel-button{-webkit-appearance:none}
.fs:focus-within{box-shadow:inset 0 0 0 1px var(--t3)}
.fx{display:flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;padding:0;border:0;border-radius:50%;background:var(--t3);color:var(--bg)}
.fx svg{width:10px;height:10px;stroke-width:3}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{display:flex;flex-direction:column;min-height:210px}
.pc h3{margin:auto 0 0;padding-top:28px;font-family:var(--serif);font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.005em}
.pc.dev h3{font-family:var(--font);font-size:21px;letter-spacing:-.025em}
.pc p{display:-webkit-box;margin:10px 0 0;overflow:hidden;font-size:15px;line-height:1.5;color:var(--t2);-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc.big{grid-column:1/-1;min-height:250px}
.pc.big h3{max-width:720px;font-size:clamp(30px,3.4vw,42px);line-height:1.1}
.pc.big p{max-width:620px;font-size:16px}
.pc .qm{position:absolute;right:24px;top:-56px;z-index:-1;font-family:var(--serif);font-size:280px;line-height:1;color:var(--chip)}
.empty{grid-column:1/-1;padding:40px 22px;border-radius:24px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px;color:var(--t2);text-align:center}
#site .seg-wrap{margin:0 0 18px}
#site .seg-wrap .segc{max-width:420px}

.apps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.apps-grid>.skel{height:190px;border-radius:24px}
.app{display:flex;flex-direction:column;gap:10px}
.app-h{display:flex;align-items:center;gap:12px}
.app-m{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;letter-spacing:0}
.app-n{flex:1;min-width:0;overflow:hidden;font-size:17px;font-weight:600;letter-spacing:-.02em;text-overflow:ellipsis;white-space:nowrap}
.app-ls{display:flex;gap:6px;flex-shrink:0}
.app-l{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:500;transition:background-color .2s}
.app-l:hover{background:var(--inv);color:var(--inv-t)}
.app-l svg{width:13px;height:13px;stroke-width:2.2}
.app-d{margin:0;font-size:15px;line-height:1.5;color:var(--t2)}
.app .a-meta{margin-top:auto;padding-top:4px}
.app-s{font-family:var(--mono);font-size:12px;color:var(--t3)}
.stk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.stk-grid .c{display:flex;flex-direction:column;gap:14px}
.stk-grid .tags{margin-top:0}

.mgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-top:48px}
.m-pro{grid-column:span 7;display:flex;flex-direction:column;min-height:330px}
.m-pro .av{width:72px;height:72px;font-size:30px;background:var(--inv);color:var(--inv-t);font-family:var(--font);font-weight:500}
.m-pro h1{margin:auto 0 0;padding-top:30px;font-size:clamp(40px,4.4vw,56px);line-height:1;font-weight:600;letter-spacing:-.05em}
.m-pro p{margin:10px 0 0;font-size:16px;color:var(--t2)}
.m-top{display:flex;justify-content:space-between;align-items:flex-start}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.act{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500;transition:background-color .2s,color .2s}
.act:hover{background:var(--inv);color:var(--inv-t)}
.act svg{width:16px;height:16px}
.m-now{grid-column:span 5;display:flex;flex-direction:column}
.nl{display:flex;flex-direction:column;margin-top:auto}
.nl div{padding:12px 0;border-top:1px solid var(--line)}
.nl div:first-child{border-top:0}
.nl small{display:block;font-size:12px;color:var(--t3)}
.nl b{display:block;margin-top:2px;font-size:15.5px;font-weight:500;line-height:1.35;letter-spacing:-.015em}
.m-bio{grid-column:span 7}
.m-bio p{margin:14px 0 0;font-family:var(--serif);font-size:19px;line-height:1.6;letter-spacing:0}
.m-side{grid-column:span 5;display:flex;flex-direction:column;gap:12px}
.mlk{display:flex;align-items:center;gap:12px;padding:16px 20px}
.mlk .ricon{width:34px;height:34px;border-radius:10px}
.mlk b{flex:1;font-size:15.5px;font-weight:500}
.mlk small{font-size:13px;color:var(--t3)}
.thm{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px}
.thm b{font-size:15.5px;font-weight:500}
.adm-l{margin:22px 0 0;text-align:center;font-size:13px}
.adm-l a{color:var(--t3)}

.read{max-width:740px;margin:0 auto;padding:40px 20px 30px}
.r-top{display:flex;justify-content:space-between;align-items:center}
.r-top .tlink{display:inline-flex;align-items:center;gap:6px;height:36px;margin:0;padding:0 14px 0 10px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500;color:var(--t1)}
.r-top .tlink svg{width:14px;height:14px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--t1)}
.ibtn svg{width:16px;height:16px}
#site .r-meta{margin-top:40px;font-size:13.5px;color:var(--t3)}
#site .r-title{margin:12px 0 14px;font-size:clamp(32px,4.4vw,48px);line-height:1.08;font-weight:600;letter-spacing:-.04em}
#site .fikr .r-title{letter-spacing:-.015em}
#site .r-lead{font-size:20px;line-height:1.5;color:var(--t2)}
#site .r-body{margin-top:40px}
.r-end{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:56px}
.r-au{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.r-au .av{width:48px;height:48px;font-size:19px;background:var(--inv);color:var(--inv-t);font-family:var(--font);font-weight:500}
.r-au .r-au-t{flex:1;min-width:0}
.r-au .av{flex-shrink:0}
.r-au b{display:block;font-size:16px;font-weight:600}
.r-au small{display:block;font-size:13.5px;color:var(--t2)}
.r-nx{display:flex;flex-direction:column;min-height:130px}
.r-nx h4{margin:auto 0 0;padding-top:20px;font-family:var(--serif);font-size:19px;line-height:1.25;font-weight:600}
.r-nx.dev h4{font-family:var(--font);font-size:17px;letter-spacing:-.02em}
.progress{height:2px;background:var(--t1)}

.foot{padding:40px 20px 130px;font-size:13px;color:var(--t3);text-align:center}
.tnav{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(4,minmax(0,1fr)) 72px 72px;gap:12px;max-width:1180px;margin:0 auto;padding:22px 32px 0}
.tnav .c{height:88px;padding:14px 16px}
button.c{border:0;font:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}
.tn{display:flex;flex-direction:column;justify-content:space-between}
.tn-t{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.tn-t svg{width:19px;height:19px;color:var(--t2);transition:color .25s}
.tn b{font-size:15.5px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;transition:color .25s}
#site .tn.on{background:var(--inv);box-shadow:none}
#site .tn.on b,#site .tn.on .tn-t,#site .tn.on .tn-t svg{color:var(--inv-t)}
#site .tn.on .tn-t span{opacity:.6}
.tn-me{display:flex;align-items:center;gap:12px}
.tn-h{display:flex;align-items:center;gap:12px;flex:1;min-width:0;height:100%}
.tn-h .av{width:46px;height:46px;font-size:18px}
.tn-h b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em}
.tn-h small{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px;color:var(--t3);white-space:nowrap}
.tn-st{display:inline-flex;align-items:center;gap:6px}
.tn-st i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.tn-st.off i{background:var(--t3);box-shadow:none}
.tn-ib{display:none}
.tn-x{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0}
.tn-x svg{width:20px;height:20px;color:var(--t2);transition:color .2s}
.tn-x:hover svg{color:var(--t1)}
.tn-x small{font-size:11px;color:var(--t3)}
.tmini{position:fixed;top:12px;left:50%;z-index:60;display:flex;align-items:center;gap:6px;padding:6px;border-radius:20px;background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);box-shadow:inset 0 0 0 .5px var(--bar-l),var(--bar-sh);opacity:0;visibility:hidden;transform:translate(-50%,-24px) scale(.96);transition:opacity .25s,transform .45s cubic-bezier(.2,.9,.25,1),visibility 0s .45s}
.tmini.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
.tmi-h{display:flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0}
.tmi-h .av{width:34px;height:34px;font-size:14px}
.tmi{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:0;border-radius:13px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:500;color:var(--t2);white-space:nowrap;transition:background-color .2s,color .2s}
.tmi:hover{color:var(--t1)}
.tmi svg{width:16px;height:16px}
.tmi.on{background:var(--inv);color:var(--inv-t);box-shadow:none}
.tmi.ic{width:40px;padding:0;justify-content:center}
.tmi-sep{width:1px;height:22px;margin:0 2px;background:var(--line)}
.hero{margin-top:44px}
.ph{margin-top:44px}
.read{padding-top:34px}
.foot{padding-bottom:48px}

.kp-back{position:fixed;inset:0;z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:12vh 20px 20px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
.kp{width:100%;max-width:640px;overflow:hidden;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 40px 100px -20px rgba(0,0,0,.6);animation:alertIn .3s cubic-bezier(.2,1.1,.4,1)}
.kp-in{display:flex;align-items:center;gap:12px;height:62px;padding:0 20px;border-bottom:1px solid var(--line)}
.kp-in svg{width:20px;height:20px;flex-shrink:0;color:var(--t3)}
.kp-in input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:20px;letter-spacing:-.02em;color:var(--t1)}
.kp-in input::placeholder{color:var(--t3)}
.kp-in input::-webkit-search-cancel-button{-webkit-appearance:none}

.kp-l{max-height:min(420px,56vh);overflow-y:auto;padding:8px}
.kp-l h6{margin:10px 12px 6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3)}
.kp-r{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;font-size:15px;color:var(--t1)}
.kp-r .ic{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--chip)}
.kp-r .ic svg{width:15px;height:15px}
.kp-r .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kp-r small{font-size:12px;color:var(--t3);white-space:nowrap}
.kp-r.on{background:var(--chip)}
.kp-r.on .ic{background:var(--inv);color:var(--inv-t)}
.kp-e{padding:30px 16px;font-size:14.5px;color:var(--t3);text-align:center}
.kp-f{display:flex;gap:18px;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}

.kp-f kbd{height:20px;min-width:20px;background:var(--chip);font-size:11px}
.tabs{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px}
.tabs a{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:600;color:var(--label);white-space:nowrap;transition:color .3s}
.tabs a svg{width:19px;height:19px}
.tabs a.on{color:var(--blue)}
.tabs-pill{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--pill);transition:transform .5s cubic-bezier(.3,1.3,.45,1),width .5s cubic-bezier(.3,1.3,.45,1),opacity .2s}
.tabs:not(.ready) .tabs-pill{transition:none}
.atabs{display:none}

.page{max-width:720px;margin:0 auto;padding:8px 20px 40px}
.page.mid{max-width:860px}
.page.narrow{max-width:680px}
.lt-head{padding:14px 0 10px}
.lt-kick{margin:0 0 2px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--label-2)}
.lt{margin:0;font-size:clamp(34px,4.4vw,44px);line-height:1.12;font-weight:700;letter-spacing:-.02em}
.lt-sub{margin:8px 0 0;max-width:560px;font-size:17px;color:var(--label-2)}
.searchbar{display:flex;align-items:center;margin:12px 0 14px}
.sfield{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:var(--fill-3);color:var(--label-2);transition:background-color .2s,box-shadow .2s}
.sfield svg{width:18px;height:18px;flex-shrink:0}
.sfield input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:17px;color:var(--label)}
.sfield input::placeholder{color:var(--label-2)}
.sfield input::-webkit-search-cancel-button{-webkit-appearance:none}
.sfield:focus-within{background:var(--fill-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 30%,transparent)}

{id:"f1",cat:"fikr",tag:"Hayot",title:"Nega fikrlarimni yozishga qaror qildim",slug:"nega-fikrlarimni-yozaman",status:"published",date:"2026-11-05",cover:null,pending:null,
excerpt:"Bu blog faqat kod haqida emas. Oʻrganayotganlarim, oʻylayotganlarim va kundalik kichik kashfiyotlarim uchun joy.",
body:L(["Uzoq vaqt blogni faqat dasturlash haqida yuritishni oʻylardim. Keyin tushundim: kod — hayotimning bir qismi, xolos. Har kuni boshqa narsalarni ham oʻrganaman: dars berishni, til oʻrganishni, intizomni, oʻzim bilan yolgʻiz qolishni.","","Yozish fikrni tartibga soladi. Boshda chalkash turgan narsa qogʻozga tushganda oddiyroq koʻrinadi. Baʼzan yozib boʻlgachgina aslida nima demoqchi ekanimni tushunaman.","","## Bu yerda nimalar boʻladi","","- Oʻrganish va oʻsish haqida kuzatuvlar","- Bolalarga dars berish tajribasi","- Til, kitob va kino haqida qisqa fikrlar","","Dasturlash haqidagi yozuvlarim alohida boʻlimda turadi — faqat shuni qidirgan odam chalgʻimasin.","","> Mukammal yozishni kutmayman. Halol yozishni xohlayman."])},
{id:"f2",cat:"fikr",tag:"Oʻsish",title:"Mustaqil oʻrganishning eng qiyin joyi",slug:"mustaqil-organish",status:"published",date:"2026-10-28",cover:null,pending:null,
excerpt:"Hech kim keyingi qadamni aytmaydi. Uni oʻzing topishing kerak — har kuni.",
body:L(["Mustaqil oʻrganishda eng qiyini mavzular emas. Eng qiyini — hech kim keyingi qadamni aytmasligi. Oʻzing oʻrganganda yoʻlni ham, surʼatni ham oʻzing belgilaysan.","","Boshida koʻp vaqtni “toʻgʻri” kursni qidirishga sarflardim. Keyin angladim: ideal kurs yoʻq. Bor narsa — boshlash va davom etish.","","## Menga yordam bergan uch narsa","","1. **Kichik maqsad.** “Laravelni oʻrganaman” emas, “bugun migratsiyalarni tushunaman”.","2. **Oʻz qoʻlim bilan yozish.** Videoni koʻrib qoʻyish bilimga aylanmaydi — kodni oʻzing yozib, xato qilib koʻrmaguncha.","3. **Savol berishdan uyalmaslik.** Notoʻgʻri savol yoʻq, soʻralmagan savol bor.","","Sekin boʻlsa ham har kuni oldinga yurish — tez, lekin haftada bir marta yurishdan yaxshiroq."])},
{id:"f3",cat:"fikr",tag:"Ustozlik",title:"Bolalarga dars berish menga nimani oʻrgatdi",slug:"bolalarga-dars-berish",status:"published",date:"2026-10-20",cover:null,pending:null,
excerpt:"Biror narsani oddiy tushuntira olmasang, demak uni hali oʻzing ham toʻliq tushunmagansan.",
body:L(["Hozir 12–18 yoshli bolalarga kompyuter savodxonligi, HTML va Python asoslaridan dars beraman. Ingliz tili grammatikasidan ham guruhlarim bor. Darsga tayyorlanish meni oʻzim kutmagan tarzda oʻzgartirdi.","","## Oddiy tushuntirish — eng qiyin ish","","`<h1>` va `<p>` teglarini oʻzim bir daqiqada tushunganman. Lekin ularni birinchi marta koʻrayotgan bolaga tushuntirish uchun misol, rasm va hikoya kerak boʻldi. Shunda bildimki, “bilaman” bilan “tushuntira olaman” orasida katta farq bor.","","## Sharoitga moslashish","","Koʻp oʻquvchilarimning uyida kompyuter yoʻq. Shuning uchun uy vazifalarini qogʻozda beraman: teglarni topish, xatoni aniqlash, sahifani qoʻlda chizish. Bu cheklov meni ijodkorroq boʻlishga majbur qildi.","","> Oʻqituvchi boʻlib, oʻzim ham yaxshiroq oʻquvchiga aylanyapman."])},
{id:"f4",cat:"fikr",tag:"Oʻsish",title:"Yolgʻizlik va tanholik — bir narsa emas",slug:"yolgizlik-va-tanholik",status:"published",date:"2026-10-12",cover:null,pending:null,
excerpt:"Ikkalasida ham yoningda hech kim yoʻq. Lekin biri seni boʻshatadi, ikkinchisi toʻldiradi.",
body:L(["Yolgʻizlik — atrofingda odam yoʻqligidan kelgan ogʻriq. Tanholik esa — oʻzing bilan qolishni oʻzing tanlaganing.","","Ikkalasida ham yoningda hech kim yoʻq. Lekin biri seni boʻshatadi, ikkinchisi toʻldiradi.","","Koʻpincha eng yaxshi fikrlar telefon chetda turganda keladi. Kod ham, yozuv ham, rejalar ham — tanholikda tugʻiladi. Shovqin ichida esa faqat boshqalarning fikrini eshitamiz.","","## Oʻzimga eslatma","","- Tanholikdan qoʻrqma — u boʻsh vaqt emas, ichki ish vaqti.","- Yolgʻizlikka koʻnikib qolma — odamlar bilan aloqa ham oziq.","- Kuniga hech boʻlmasa yigirma daqiqa ekransiz vaqt.","","> Bu mavzuni Telegram kanalimda ingliz tilida ham yozganman."])},
{id:"f5",cat:"fikr",tag:"Til",title:"Ingliz tilini kundalik odatga aylantirish",slug:"ingliz-tili-odat",status:"published",date:"2026-10-03",cover:null,pending:null,
excerpt:"Til darslikda emas, kundalikda oʻrganiladi: hujjatlar, videolar va kichik odatlar orqali.",
body:L(["Ingliz tili men uchun fan emas, vosita. Dasturlashdagi eng yaxshi hujjatlar, savol va javoblar ingliz tilida. Shuning uchun uni alohida “dars” emas, kundalik odatga aylantirishga harakat qilyapman.","","## Sinab koʻrayotgan usullarim","","- **Texnik mavzularni inglizcha manbadan oʻqish.** Masalan, PHP MVCʼni toʻgʻridan-toʻgʻri ingliz tilida.","- **Har kuni bir nechta yangi soʻz.** Koʻp emas, lekin har kuni.","- **Jonli til.** Grammatika bilan birga kundalik iboralar va slangni ham — kitobdagi til bilan koʻchadagi til har xil.","- **Oʻzbekchadan inglizchaga yozish.** Kanalimdagi postlarni avval oʻzbekcha oʻylab, keyin inglizchaga oʻgiraman.","","Xato qilishdan qoʻrqmaslik kerak. Til — gapirgan sari silliqlanadigan tosh."])},

function inline(s){
  s=esc(s);
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>/^(https?:\/\/|#\/|\/)/.test(u)?'<a href="'+u+'"'+(/^https?:/.test(u)?' target="_blank" rel="noopener"':"")+">"+t+"</a>":t);
  return s.replace(/\u0000(\d+)\u0000/g,(m,n)=>"<code>"+codes[n]+"</code>");
}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n");
  const block=/^(```|#{1,3}\s|>\s?|[-*]\s|\d+\.\s|!\[[^\]]*\]\(|---+\s*$)/;
  const ids=new Set();
  const uid=t=>{const b=slugify(t)||"bolim";let id=b,n=2;while(ids.has(id))id=b+"-"+n++;ids.add(id);return id};
  let html="",i=0;
  while(i<lines.length){
    const line=lines[i];
    if(/^```/.test(line)){const lang=line.slice(3).trim();const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}i++;html+='<pre data-lang="'+esc(lang)+'"><code>'+esc(buf.join("\n"))+"</code></pre>";continue}
    if(/^#{1,3}\s/.test(line)){const tag=/^###\s/.test(line)?"h3":"h2";const t=line.replace(/^#+\s/,"");html+="<"+tag+' id="'+uid(t)+'">'+inline(t)+"</"+tag+">";i++;continue}
    const im=line.match(/^!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)\s*$/);
    if(im){html+='<figure><img src="'+esc(im[2])+'" alt="'+esc(im[1])+'" loading="lazy">'+(im[1]?"<figcaption>"+esc(im[1])+"</figcaption>":"")+"</figure>";i++;continue}
    if(/^---+\s*$/.test(line)){html+="<hr>";i++;continue}
    if(/^>\s?/.test(line)){const buf=[];while(i<lines.length&&/^>\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,""));i++}html+="<blockquote>"+inline(buf.join(" "))+"</blockquote>";continue}
    if(/^[-*]\s/.test(line)){const buf=[];while(i<lines.length&&/^[-*]\s/.test(lines[i])){buf.push("<li>"+inline(lines[i].replace(/^[-*]\s/,""))+"</li>");i++}html+="<ul>"+buf.join("")+"</ul>";continue}
    if(/^\d+\.\s/.test(line)){const buf=[];while(i<lines.length&&/^\d+\.\s/.test(lines[i])){buf.push("<li>"+inline(lines[i].replace(/^\d+\.\s/,""))+"</li>");i++}html+="<ol>"+buf.join("")+"</ol>";continue}
    if(!line.trim()){i++;continue}
    const buf=[line];i++;
    while(i<lines.length&&lines[i].trim()&&!block.test(lines[i])){buf.push(lines[i]);i++}
    html+="<p>"+inline(buf.join(" "))+"</p>";
  }
  return html;
}

function iosAlert(o){
  return new Promise(res=>{
    const prev=document.activeElement;
    const back=document.createElement("div");
    back.className="alert-back";
    back.innerHTML=`<div class="alert glass" role="alertdialog" aria-modal="true" aria-labelledby="al-t"${o.message?' aria-describedby="al-m"':""}><h3 id="al-t">${esc(o.title)}</h3>${o.message?`<p id="al-m">${esc(o.message)}</p>`:""}<div class="alert-btns"><button type="button" data-a="0">${esc(o.cancel||"Bekor qilish")}</button><button type="button" data-a="1" class="destructive">${esc(o.ok||"Oʻchirish")}</button></div></div>`;
    document.body.appendChild(back);
    const onKey=e=>{
      if(e.key==="Escape"){e.preventDefault();e.stopPropagation();done(false)}
      else if(e.key==="Tab"){e.preventDefault();const bs=$$("button",back);const i=bs.indexOf(document.activeElement);bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus()}
    };
    const done=v=>{document.removeEventListener("keydown",onKey,true);back.classList.add("out");setTimeout(()=>back.remove(),160);if(prev&&prev.isConnected&&prev.focus)prev.focus();res(v)};
    document.addEventListener("keydown",onKey,true);
    back.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)done(b.dataset.a==="1");else if(e.target===back)done(false)});
    $('[data-a="0"]',back).focus();
  });
}

}

function gridDays(fn){
  const end=new Date();end.setHours(0,0,0,0);
  const di=(end.getDay()+6)%7;
  const start=new Date(end);start.setDate(end.getDate()-(52*7+di));
  const out=[];
  for(let i=0;i<371;i++){const d=new Date(start);d.setDate(start.getDate()+i);out.push(d>end?null:{d:isoOf(d),c:fn(isoOf(d),d)})}
  return out;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demoGithub(){
  const rnd=mulberry32(20261105);
  const now=Date.now();
  const days=gridDays((iso,d)=>{const age=(now-d.getTime())/864e5;const g=Math.max(.08,1-age/400);const w=((d.getDay()+6)%7)>=5?.5:1;return rnd()<.1+g*.62*w?1+Math.floor(rnd()*rnd()*11*g*w+rnd()*2):0});
  const runs=DEMO_RUNS.map(r=>Object.assign({},r,{key:r.repo,at:new Date(now-r.t*864e5).toISOString(),url:null}));
  const info={};
  Object.keys(DEMO_INFO).forEach(k=>{const v=DEMO_INFO[k];info[k]={lang:v.lang,stars:v.stars,pushed:new Date(now-v.pushed*864e5).toISOString(),url:null}});
  return{real:false,days,runs,info,range:"soʻnggi yil"};
}
async function gj(url){const r=await fetch(url,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw new Error(String(r.status));return r.json()}
function mapRun(w,full){
  const done=w.status==="completed";
  const c=w.conclusion;
  const status=!done?"running":c==="success"?"success":(c==="skipped"||c==="cancelled"||c==="neutral")?"skipped":"failure";
  const start=w.run_started_at||w.created_at;
  return{key:full.toLowerCase(),repo:full.split("/")[1],workflow:w.name||"Workflow",title:String(w.display_title||(w.head_commit&&w.head_commit.message)||w.name||"").split("\n")[0],branch:w.head_branch||"",num:w.run_number,status,dur:done?(new Date(w.updated_at)-new Date(start))/1000:null,at:w.created_at,url:w.html_url};
}
async function fetchGithub(u){
  const ck="ut4_gh_"+u.toLowerCase()+"_"+hashStr(projects.map(p=>p.repo).join(","));
  try{const c=JSON.parse(sessionStorage.getItem(ck)||"null");if(c&&Date.now()-c.at<6e5)return c.data}catch(e){}
  const api="https://api.github.com";
  const user=await gj(api+"/users/"+encodeURIComponent(u));
  const login=user.login;
  const contribP=fetch("https://github-contributions-api.jogruber.de/v4/"+encodeURIComponent(login)+"?y=last").then(r=>r.ok?r.json():null).catch(()=>null);
  const repoList=await gj(api+"/users/"+encodeURIComponent(login)+"/repos?sort=pushed&per_page=100").catch(()=>[]);
  const info={};
  repoList.forEach(r=>{info[r.full_name.toLowerCase()]={lang:r.language,stars:r.stargazers_count,pushed:r.pushed_at,url:r.html_url}});
  const fulls=[...new Set(projects.map(p=>fullRepo(p.repo,login)).filter(f=>f.includes("/")))].slice(0,8);
  const lists=await Promise.all(fulls.map(f=>gj(api+"/repos/"+f.split("/").map(encodeURIComponent).join("/")+"/actions/runs?per_page=6").then(j=>(j.workflow_runs||[]).map(w=>mapRun(w,f))).catch(()=>[])));
  const runs=lists.flat().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,12);
  let days,range;
  const contrib=await contribP;
  if(contrib&&Array.isArray(contrib.contributions)){
    const m={};contrib.contributions.forEach(c=>{m[c.date]=c.count});
    days=gridDays(iso=>m[iso]||0);range="soʻnggi yil";
  }else{
    const ev=await gj(api+"/users/"+encodeURIComponent(login)+"/events/public?per_page=100").catch(()=>[]);
    const m={};
    ev.forEach(e=>{const d=isoOf(new Date(e.created_at));const n=e.type==="PushEvent"?((e.payload&&(e.payload.size||(e.payload.commits||[]).length))||1):1;m[d]=(m[d]||0)+n});
    days=gridDays(iso=>m[iso]||0);range="soʻnggi 90 kun";
  }
  const data={real:true,login,days,runs,info,range};
  try{sessionStorage.setItem(ck,JSON.stringify({at:Date.now(),data}))}catch(e){}
  return data;
}
function streaks(days){
  const arr=days.filter(Boolean);
  let longest=0,run=0,cur=0;
  arr.forEach(x=>{if(x.c>0){run++;longest=Math.max(longest,run)}else run=0});
  for(let i=arr.length-1;i>=0;i--){if(arr[i].c>0)cur++;else if(i===arr.length-1)continue;else break}
  return{longest,cur,total:arr.reduce((s,x)=>s+x.c,0),active:arr.filter(x=>x.c>0).length};
}
function heatmapHTML(days){
  const lvl=c=>c<=0?0:c<=2?1:c<=5?2:c<=9?3:4;
  let months="",prev=-1;
  for(let w=0;w<53;w++){
    const cell=days[w*7];if(!cell)continue;
    const m=+cell.d.slice(5,7)-1;
    if(m!==prev){const skip=w===0&&days[14]&&(+days[14].d.slice(5,7)-1)!==m;if(!skip&&w<51)months+='<span style="grid-column:'+(w+1)+'/span 3">'+MON_SHORT[m]+"</span>";prev=m}
  }
  const cells=days.map(x=>x?'<i data-l="'+lvl(x.c)+'" data-c="'+x.c+'" data-d="'+x.d+'"></i>':'<i class="x"></i>').join("");
  return '<div class="hm"><div class="hm-months" aria-hidden="true">'+months+'</div><div class="hm-body"><div class="hm-days" aria-hidden="true"><span>Du</span><span></span><span>Ch</span><span></span><span>Ju</span><span></span><span></span></div><div class="hm-grid" role="img" aria-label="GitHub faollik xaritasi">'+cells+'</div></div><div class="hm-foot"><span>Kataklar ustiga olib boring</span><div class="legend"><span>Kam</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>Koʻp</span></div></div></div>';
}

function mdAction(kind){
  const ta=$("#fb");if(!ta||ta.hidden)return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  const wrap=(a,b,ph)=>{const t=sel||ph;ta.setRangeText(a+t+b,s,e,"end");ta.setSelectionRange(s+a.length,s+a.length+t.length)};
  const lines=(pre,ph)=>{const ls=v.lastIndexOf("\n",s-1)+1;const t=v.slice(ls,e)||ph;ta.setRangeText(t.split("\n").map(l=>pre+l).join("\n"),ls,e,"end")};
  const blockIns=(txt,selFrom,selLen)=>{const before=s>0&&v[s-1]!=="\n"?"\n\n":"";const after=v[e]&&v[e]!=="\n"?"\n\n":"\n";ta.setRangeText(before+txt+after,s,e,"end");const st=s+before.length+selFrom;ta.setSelectionRange(st,st+selLen)};
  ta.focus();
  if(kind==="h2")lines("## ","Boʻlim sarlavhasi");
  else if(kind==="bold")wrap("**","**","qalin matn");
  else if(kind==="italic")wrap("*","*","kursiv");
  else if(kind==="code")wrap("`","`","kod");
  else if(kind==="link")wrap("[","](https://)","havola matni");
  else if(kind==="list")lines("- ","Element");
  else if(kind==="quote")lines("> ","Iqtibos");
  else if(kind==="block"){const t=sel||"echo 'Salom';";blockIns("```php\n"+t+"\n```",7,t.length)}
  else if(kind==="image")blockIns("![rasm tavsifi](https://)",2,12);
  ta.dispatchEvent(new Event("input"));
}
function loadCover(file){
  if(!file||!/^image\//.test(file.type)){toast("Rasm faylini tanlang");return}
  if(file.size>15*1024*1024){toast("Rasm 15 MB dan katta");return}
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    const s=Math.min(1,1600/img.width);
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    if(!ed)return;
    ed.cover=c.toDataURL("image/jpeg",.82);
    edChanged();
    toast("Muqova yuklandi");
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Rasmni oʻqib boʻlmadi")};
  img.src=url;
}
function edPublish(){
  if(!ed)return;
  const p=edSave(false)||(ed.id&&posts.find(x=>x.id===ed.id));

  const wasPub=p.status==="published";
  if(wasPub&&!p.pending){toast("Oʻzgarish yoʻq");return}
  const d=viewOf(p);
  if(!d.title){toast("Sarlavha yozilmagan");if(ed.mode!=="write")setMode("write");$("#ft").focus();return}
  if(!d.body.trim()){toast("Matn boʻsh");if(ed.mode!=="write")setMode("write");$("#fb").focus();return}
  let slug=d.slug||slugify(d.title)||"yozuv-"+p.id;
  if(!slugFree(slug,p.id)){
    if(ed.slugTouched&&d.slug){toast("Bu havola band — boshqasini tanlang");toggleSheet(true);return}
    let n=2;while(!slugFree(slug+"-"+n,p.id))n++;slug=slug+"-"+n;
  }
  Object.assign(p,{cat:d.cat,title:d.title,slug,tag:d.tag,excerpt:d.excerpt||autoExcerpt(d.body),body:d.body,date:d.date||today(),cover:d.cover||null,status:"published",pending:null,updatedAt:new Date().toISOString()});

  renderAdminList("posts",p.id);
  openEditor(p.id);
}

  const bar=$("#progress");
  if(bar)bar.style.width=(pr*100)+"%";
  const tn=$("#tnav"),tm=$("#tmini");
  if(tn&&tm){
    const out=tn.getBoundingClientRect().bottom<-6;
    let show=out;
    if(out&&document.body.dataset.route==="post"&&pr<.98){
      if(Math.abs(y-lastY)>10){tm.dataset.dir=y>lastY?"down":"up";lastY=y}
      show=tm.dataset.dir!=="down";
    }else lastY=y;
    tm.classList.toggle("show",show);
  }
  hideTip();
}

function route(){
  const fns=cleanup;cleanup=[];
  fns.forEach(fn=>{try{fn()}catch(e){}});
  const h=location.hash.replace(/^#/,"")||"/";
  const parts=h.split("/").filter(Boolean);
  const r=parts[0]||"home";
  devToken++;
  closeKp(true);
  hideTip();
  document.body.dataset.route=r;
  if(r==="admin"){
    siteEl.hidden=true;adminEl.hidden=false;
    renderAdmin(parts[1],parts[2]);
    requestAnimationFrame(placeTabs);
    return;
  }
  ed=null;
  adminState.section=null;adminEl.innerHTML="";adminEl.hidden=true;siteEl.hidden=false;
  setNav(r);
  if(r==="home")renderHome();
  else if(r==="fikrlar")renderFikrlar();
  else if(r==="dasturlash")renderDev(parts[1]);
  else if(r==="men")renderMen();
  else if(r==="post")renderPost(decodeURIComponent(parts[1]||""));
  else renderNotFound();
  view.classList.remove("view-in");void view.offsetWidth;view.classList.add("view-in");
  window.scrollTo(0,0);
  lastY=0;
  const tm=$("#tmini");if(tm){tm.dataset.dir="";tm.classList.remove("show")}
  onScroll();
  requestAnimationFrame(placeTabs);
}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-theme-toggle]")){setTheme(root.dataset.theme==="dark"?"light":"dark");return}
  if(e.target.closest("[data-share]")){sharePost();return}
  if(e.target.closest("[data-kp]")){openKp();return}
  const j=e.target.closest("[data-jump]");
  if(j){e.preventDefault();const t=document.getElementById(j.dataset.jump);if(t)t.scrollIntoView({behavior:reduceMotion?"auto":"smooth"});return}
  if(e.target.closest("[data-logout]")){
    if(ed&&ed.timer)edSave(true);
    authed=false;try{sessionStorage.removeItem(K.auth)}catch(err){}
    toast("Hisobdan chiqdingiz");
    location.hash="#/";
    return;
  }
  const a=e.target.closest("a");
  if(!a)return;
  if(a.hasAttribute("data-demo")){e.preventDefault();toast("Bu namuna — GitHub username kiriting",{label:"Sozlamalar",href:"#/admin/settings"});return}
  if(a.dataset.todo){e.preventDefault();toast(a.dataset.todo+" havolasi hali qoʻshilmagan");return}
  if(a.getAttribute("href")==="#")e.preventDefault();
});
document.addEventListener("keydown",e=>{
  const act=document.activeElement;
  const typing=act&&(/INPUT|TEXTAREA|SELECT/.test(act.tagName)||act.isContentEditable);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"&&!ed&&!siteEl.hidden){e.preventDefault();if($("#kp"))closeKp();else openKp();return}
  if(e.key==="Escape"){if($("#kp")){e.preventDefault();closeKp();return}const s=$("#sheet");if(s&&!s.hidden){e.preventDefault();toggleSheet(false);return}}
  if(e.key==="/"&&!typing){const s=$("#bq");if(s){e.preventDefault();s.focus()}}
  if((e.key==="n"||e.key==="N")&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&authed&&!adminEl.hidden&&!$(".alert-back")){e.preventDefault();location.hash="#/admin/posts/new"}
  if(ed&&(e.ctrlKey||e.metaKey)){
    if(e.key.toLowerCase()==="s"){e.preventDefault();edSave(false)}
    else if(e.key==="Enter"){e.preventDefault();edPublish()}
  }
});
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",placeAll);
window.addEventListener("hashchange",route);
window.addEventListener("beforeunload",()=>{if(ed&&ed.timer)edSave(true)});

$$("[data-ico]").forEach(el=>{el.outerHTML=ico[el.dataset.ico]||""});
applyTheme();
syncSite();
bindGlow();
route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeAll);
</script>
</body>
</html>
