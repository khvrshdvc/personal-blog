include:
  - backend/compose.yaml

services:
  frontend:
    profiles: [frontend]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      API_URL: http://laravel.test
      SITE_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - sail

volumes:
  frontend-node-modules:
